<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard – PaidTasksHub</title>
<meta name="theme-color" content="#0b1b34">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <a class="brand" href="/app#/"><span class="brand-mark">P</span><span>PaidTasks<b>Hub</b></span></a>
        <nav class="side-nav" id="sideNav" aria-label="Main"></nav>
        <div class="side-foot">Signed in as <strong id="sideUser"></strong></div>
    </aside>

    <div class="main">
        <header class="topbar">
            <a class="brand" href="/app#/"><span class="brand-mark">P</span><span>PaidTasks<b>Hub</b></span></a>
            <h1 id="pageTitle">Dashboard</h1>
            <div class="top-right">
                <a class="chip" href="#/wallet" aria-label="Wallet balance"><span class="chip-label">Balance</span> <strong id="topBalance">…</strong></a>
                <div class="avatar" id="avatar" aria-hidden="true"></div>
            </div>
        </header>
        <main class="content" id="view" aria-live="polite"><div class="spinner" role="status" aria-label="Loading"></div></main>
    </div>
</div>

<nav class="bottom-nav" id="bottomNav" aria-label="Main"></nav>
<div class="toast" id="toast" role="status" aria-live="assertive"></div>

<script src="/js/app.js"></script>
</body>
</html>
